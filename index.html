<head>
    <meta charset="UTF-8">
    <title>My Web Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="gen_table.js" defer></script>
</head>
<body>
    <header>
        <h1>Text</h1>
    </header>
    <div class="middle">
        <div class="left">
            <div class="txt bold bf">
                Find the output of the following program:
            </div>
            <div id="category-text" class="txt g">
                (Categories:)
            </div>
            <div id="cbox" class="cbox">
                <textarea id="code" class="txtcode bold" name="code" rows="4" cols="10" placeholder="" readonly>#include <stdio.h></textarea>
            </div>
        </div>
        <div class="right">
            <div class="txt bold bf">
                Your answer:
            </div>
            <div class="spacer"></div>
            <div id="tableContainer">
            </div>
            <div class="hmenu">
                <button id="verifyBtn">
                    Verify
                </button>
                <label for="solution">Show solution:</label>
                <input type="checkbox" id="solution" name="sol_chbox" disabled>
            </div>
        </div>
    </div>
    <footer>
        <div class="container">
            <button id="randomBtn">
                Random
            </button>
        </div>
        <div class="container">
            <button id="categoryBtn">
                Categories
            </button>
        </div>

        <div class="container">
            <label for="dataset-select">Dataset:</label>
            <select name="dataset" id="dataset-select">
                <option value="official">Official</option>
                <option value="generated">Generated</option>
            </select>
        </div>
    </footer>
</body>
